<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>🌜Moon Viewer🌛</title>
    <meta
      name="viewport"
      content="initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <script src="https://unpkg.com/maplibre-gl@^5/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl@^5/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #05060a;
        /* 宇宙空間: 星 + ほのかな星雲 */
        background-image:
          radial-gradient(1.5px 1.5px at 40px 60px, #ffffff, transparent),
          radial-gradient(1px 1px at 130px 180px, #ffffff, transparent),
          radial-gradient(1px 1px at 200px 90px, #cfe9ff, transparent),
          radial-gradient(1.5px 1.5px at 300px 250px, #ffffff, transparent),
          radial-gradient(1px 1px at 350px 120px, #ffd9a0, transparent),
          radial-gradient(1px 1px at 90px 320px, #ffffff, transparent),
          radial-gradient(1.5px 1.5px at 250px 360px, #e0e7ff, transparent),
          radial-gradient(
            ellipse at 75% 25%,
            rgba(80, 60, 140, 0.25),
            transparent 60%
          ),
          radial-gradient(
            ellipse at 20% 80%,
            rgba(40, 90, 140, 0.2),
            transparent 60%
          );
        background-size:
          400px 400px,
          400px 400px,
          400px 400px,
          400px 400px,
          400px 400px,
          400px 400px,
          400px 400px,
          100% 100%,
          100% 100%;
        background-repeat:
          repeat, repeat, repeat, repeat, repeat, repeat, repeat, no-repeat,
          no-repeat;
      }
      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
        background: transparent;
      }
      #legend {
        position: absolute;
        bottom: 30px;
        right: 10px;
        z-index: 1;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-family: sans-serif;
        font-size: 11px;
        padding: 8px 10px;
        border-radius: 6px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
      }
      #legend .title {
        font-weight: bold;
        margin-bottom: 6px;
        text-align: center;
      }
      #legend .ramp {
        display: flex;
        align-items: stretch;
      }
      #legend .bar {
        width: 14px;
        height: 160px;
        border-radius: 3px;
        /* low (bottom) -> high (top) */
        background: linear-gradient(
          to top,
          #2c0a4a 0%,
          #2563eb 15.8%,
          #06b6d4 31.6%,
          #22c55e 47.4%,
          #eab308 63.2%,
          #ef4444 78.9%,
          #ffffff 100%
        );
      }
      #legend .labels {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        margin-left: 6px;
        height: 160px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="legend" style="display: none">
      <div class="title">Elevation (m)</div>
      <div class="ramp">
        <div class="bar"></div>
        <div class="labels">
          <span>10000</span>
          <span>6000</span>
          <span>3000</span>
          <span>0</span>
          <span>-3000</span>
          <span>-6000</span>
          <span>-9000</span>
        </div>
      </div>
    </div>
    <script>
      const map = new maplibregl.Map({
        container: "map",
        zoom: 2,
        hash: true,
        antialias: true,
        style: {
          version: 8,
          projection: { type: "globe" },
          glyphs: "https://mierune.github.io/fonts/{fontstack}/{range}.pbf",
          sources: {
            surface: {
              type: "raster",
              tiles: [
                "https://tiles.spatialty.io/moon_surface/{z}/{x}/{y}.png",
              ],
              tileSize: 256,
              maxzoom: 7,
              attribution:
                'USGS/NASA: <a href="https://astrogeology.usgs.gov/search/map/Moon/LRO/LROC_WAC/Lunar_LRO_LROC-WAC_Mosaic_global_100m_June2013">Surface</a> | <a href="https://planetarynames.wr.usgs.gov/Page/MOON/target">Crater</a> | <a href="https://pgda.gsfc.nasa.gov/products/54">DEM</a>',
            },
            terrain: {
              type: "raster-dem",
              tiles: [
                "https://tiles.spatialty.io/moon_terrain/{z}/{x}/{y}.png",
              ],
              tileSize: 512,
              maxzoom: 8,
              bounds: [-180, -60, 180, 60],
              // TerrainRGB: base -20000m, resolution 1m
              // MapLibre decodes: elevation = R*redFactor + G*greenFactor + B*blueFactor - baseShift
              // => elevation = (R*65536 + G*256 + B) - 20000
              encoding: "custom",
              redFactor: 65536,
              greenFactor: 256,
              blueFactor: 1,
              baseShift: 20000,
            },
            crater: {
              type: "geojson",
              data: "./crater.geojson",
            },
          },
          layers: [
            {
              id: "surface",
              type: "raster",
              source: "surface",
              paint: {
                "raster-fade-duration": 0,
              },
            },
            {
              id: "elevation-color",
              type: "color-relief",
              source: "terrain",
              layout: {
                visibility: "none",
              },
              paint: {
                "color-relief-opacity": 0.6,
                "color-relief-color": [
                  "interpolate",
                  ["linear"],
                  ["elevation"],
                  -9000,
                  "#2c0a4a",
                  -6000,
                  "#2563eb",
                  -3000,
                  "#06b6d4",
                  0,
                  "#22c55e",
                  3000,
                  "#eab308",
                  6000,
                  "#ef4444",
                  10000,
                  "#ffffff",
                ],
              },
            },
            {
              id: "crater",
              type: "symbol",
              source: "crater",
              layout: {
                "text-field": ["get", "name"],
                "text-font": ["Metropolis Bold"],
                "text-size": 15,
              },
              paint: {
                "text-color": "white",
                "text-halo-color": "black",
                "text-halo-width": 1,
              },
              minzoom: 5,
            },
            {
              id: "crater-mid",
              type: "symbol",
              source: "crater",
              layout: {
                "text-field": ["get", "name"],
                "text-font": ["Metropolis Bold"],
                "text-size": 17,
              },
              paint: {
                "text-color": "white",
                "text-halo-color": "black",
                "text-halo-width": 1,
              },
              filter: [">", ["get", "diameter"], 100],
              minzoom: 3.5,
            },
            {
              id: "crater-big",
              type: "symbol",
              source: "crater",
              layout: {
                "text-field": ["get", "name"],
                "text-font": ["Metropolis Bold"],
                "text-size": 20,
              },
              paint: {
                "text-color": "white",
                "text-halo-color": "black",
                "text-halo-width": 1,
              },
              filter: [">", ["get", "diameter"], 300],
            },
          ],
          terrain: {
            source: "terrain",
            exaggeration: 1.5,
          },
        },
        maxPitch: 85,
        maxZoom: 10,
      });

      map.addControl(new maplibregl.NavigationControl());
      map.addControl(new maplibregl.FullscreenControl());
      map.addControl(new maplibregl.LogoControl(), "bottom-left");

      // 標高表示のオン/オフを切り替えるカスタムコントロール
      class ElevationToggleControl {
        onAdd(map) {
          this._map = map;
          this._enabled = false;
          this._container = document.createElement("div");
          this._container.className = "maplibregl-ctrl maplibregl-ctrl-group";

          this._button = document.createElement("button");
          this._button.type = "button";
          this._button.title = "Toggle Elevation Color";
          this._button.setAttribute("aria-pressed", "false");
          this._button.textContent = "⛰";
          this._button.style.fontSize = "16px";
          this._button.style.opacity = "0.4";
          this._button.addEventListener("click", () => this._toggle());

          this._container.appendChild(this._button);
          return this._container;
        }

        _toggle() {
          this._enabled = !this._enabled;
          const visibility = this._enabled ? "visible" : "none";
          this._map.setLayoutProperty(
            "elevation-color",
            "visibility",
            visibility,
          );
          this._button.setAttribute("aria-pressed", String(this._enabled));
          this._button.style.opacity = this._enabled ? "1" : "0.4";
          document.getElementById("legend").style.display = this._enabled
            ? ""
            : "none";
        }

        onRemove() {
          this._container.parentNode.removeChild(this._container);
          this._map = undefined;
        }
      }

      map.addControl(new ElevationToggleControl());

      // 自動回転モードを切り替えるカスタムコントロール
      class SpinControl {
        constructor() {
          this._spinning = false;
          this._raf = null;
          this._userInteracting = false;
          this._degPerSecond = 6; // 回転速度（度/秒）
          this._lastTime = null;
        }

        onAdd(map) {
          this._map = map;
          this._container = document.createElement("div");
          this._container.className = "maplibregl-ctrl maplibregl-ctrl-group";

          this._button = document.createElement("button");
          this._button.type = "button";
          this._button.title = "Toggle Auto Rotate";
          this._button.setAttribute("aria-pressed", "false");
          this._button.textContent = "↻";
          this._button.style.fontSize = "16px";
          this._button.style.opacity = "0.4";
          this._button.addEventListener("click", () => this._toggle());
          this._container.appendChild(this._button);

          // ユーザー操作中は回転を止める
          this._onStart = () => {
            this._userInteracting = true;
          };
          this._onEnd = () => {
            this._userInteracting = false;
          };
          map.on("mousedown", this._onStart);
          map.on("touchstart", this._onStart);
          map.on("mouseup", this._onEnd);
          map.on("touchend", this._onEnd);

          return this._container;
        }

        _toggle() {
          this._spinning = !this._spinning;
          this._button.setAttribute("aria-pressed", String(this._spinning));
          this._button.style.opacity = this._spinning ? "1" : "0.4";
          if (this._spinning) {
            this._lastTime = null;
            this._raf = requestAnimationFrame((t) => this._frame(t));
          } else if (this._raf) {
            cancelAnimationFrame(this._raf);
            this._raf = null;
          }
        }

        _frame(time) {
          if (!this._spinning) return;
          if (this._lastTime != null && !this._userInteracting) {
            const dt = (time - this._lastTime) / 1000;
            const center = this._map.getCenter();
            center.lng = ((center.lng + this._degPerSecond * dt + 180) % 360) - 180;
            this._map.setCenter(center);
          }
          this._lastTime = time;
          this._raf = requestAnimationFrame((t) => this._frame(t));
        }

        onRemove() {
          if (this._raf) cancelAnimationFrame(this._raf);
          this._map.off("mousedown", this._onStart);
          this._map.off("touchstart", this._onStart);
          this._map.off("mouseup", this._onEnd);
          this._map.off("touchend", this._onEnd);
          this._container.parentNode.removeChild(this._container);
          this._map = undefined;
        }
      }

      map.addControl(new SpinControl());
    </script>
  </body>
</html>
